# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: "github-actions" # See documentation for possible values
    directory: "/" # Location of package manifests
    schedule:
      interval: "weekly"
    # Produce Conventional Commits titles (e.g. "build(deps): Bump ...") so PRs
    # pass the "Lint PR title" check that gates the squash-merge commit subject.
    commit-message:
      prefix: "build"
      include: "scope"
    groups:
      # Roll all GitHub Actions bumps into a single PR
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: "pip"
    directory: "/" # pyproject.toml
    schedule:
      interval: "weekly"
    # Produce Conventional Commits titles (e.g. "build(deps): Bump ...") so PRs
    # pass the "Lint PR title" check that gates the squash-merge commit subject.
    commit-message:
      prefix: "build"
      include: "scope"
    groups:
      # Roll the Sphinx docs toolchain (docs/requirements.txt) into one PR
      sphinx:
        patterns:
          - "sphinx"
          - "sphinx-*"
          - "sphinxext-*"
