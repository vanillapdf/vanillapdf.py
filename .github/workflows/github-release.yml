name: Create GitHub Release

# Creates the GitHub release as a DRAFT and attaches the built wheels. The tag is
# deliberately NOT created here: publishing the draft (after the production gate
# in release.yml) is what creates it, at `target`. Pre-creating the tag would
# leave the published release bound to an untagged-* placeholder.

on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
      prerelease:
        required: true
        type: boolean
      latest:
        required: false
        type: boolean
        default: true
      target:
        description: "Commit SHA the tag is created at when the draft is published"
        required: false
        type: string
        default: ''
    outputs:
      release_id:
        description: "Numeric id of the draft release. Later jobs must address the draft by id, not tag: the tag does not exist as a ref until the draft is published, and an API edit to the draft body that omits tag_name resets it, after which tag-based lookup fails."
        value: ${{ jobs.github-release.outputs.release_id }}
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag name (e.g. v2.3.0-rc.2)"
        required: true
      prerelease:
        description: "Set to true for prerelease"
        required: true
        type: boolean
      latest:
        description: "Set as latest release"
        required: false
        type: boolean
        default: true
      target:
        description: "Commit SHA the tag is created at when the draft is published"
        required: false
        type: string
        default: ''

permissions: {}

jobs:
  github-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      release_id: ${{ steps.create.outputs.release_id }}
    permissions:
      contents: write       # Required to create a release and upload assets
      id-token: write       # Required for Sigstore keyless signing
      attestations: write   # Required for GitHub artifact attestations

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - name: Create draft release
        id: create
        env:
          TAG: ${{ inputs.tag }}
          PRERELEASE: ${{ inputs.prerelease }}
          LATEST: ${{ inputs.latest }}
          TARGET: ${{ inputs.target }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          # Reuse the draft from an earlier attempt rather than creating a second
          # release for the same tag. A draft from a previous run has long since
          # propagated, so the list endpoint is safe to consult here - which is NOT
          # true of a draft created milliseconds ago (see below).
          RELEASE_ID=$(gh api "repos/${GH_REPO}/releases" \
            --jq ".[] | select(.tag_name == \"$TAG\") | .id" | head -n 1)

          if [ -n "$RELEASE_ID" ]; then
            echo "Release $TAG already exists (id $RELEASE_ID). Skipping create."
          else
            echo "Creating draft release for tag: $TAG"

            MAKE_LATEST=true
            if [ "$LATEST" = "false" ]; then
              MAKE_LATEST=false
            fi

            TARGET_ARG=()
            if [ -n "$TARGET" ]; then
              TARGET_ARG=(-f target_commitish="$TARGET")
            fi

            # Create through the REST API, not `gh release create`, because the POST
            # response carries the new release's id. Re-reading the releases list to
            # find the id of a release created milliseconds earlier is a race: that
            # endpoint is eventually consistent and can return a stale page.
            #
            # The tag must NOT exist yet: publishing this draft is what creates the
            # tag (at TARGET) and binds the release to it. Pre-creating the tag would
            # leave the published release stuck on its untagged-* placeholder.
            RELEASE_ID=$(gh api --method POST "repos/${GH_REPO}/releases" \
              -f tag_name="$TAG" \
              -f name="vanillapdf.py $TAG" \
              -F draft=true \
              -F prerelease="$PRERELEASE" \
              -F generate_release_notes=true \
              -f make_latest="$MAKE_LATEST" \
              "${TARGET_ARG[@]}" \
              --jq .id)
          fi

          if [ -z "$RELEASE_ID" ]; then
            echo "::error::Could not resolve release id for $TAG"
            exit 1
          fi
          echo "Resolved release id: $RELEASE_ID"
          echo "release_id=$RELEASE_ID" >> "$GITHUB_OUTPUT"

      - name: Download built wheels
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          path: dist
          pattern: vanillapdf-wheels-*
          merge-multiple: true

      - name: Upload wheels to release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: |
          shopt -s nullglob
          WHEELS=(dist/*.whl)
          if [ ${#WHEELS[@]} -eq 0 ]; then
            echo "::error::No wheels found to attach to the release"
            exit 1
          fi
          echo "Uploading ${#WHEELS[@]} wheels"
          gh release upload "$TAG" "${WHEELS[@]}"

      - name: Attest wheel provenance
        id: attest-wheels
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-path: dist/*.whl

      - name: Upload provenance to release
        # Attach the signed provenance bundle as a release asset. The attestation
        # also lives in GitHub's attestation store, but OpenSSF Scorecard's
        # Signed-Releases check only inspects release assets and credits a
        # *.intoto.jsonl provenance file.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUNDLE_PATH: ${{ steps.attest-wheels.outputs.bundle-path }}
          TAG: ${{ inputs.tag }}
        run: |
          PROVENANCE="vanillapdf.py-${TAG}.intoto.jsonl"
          cp "$BUNDLE_PATH" "$PROVENANCE"
          gh release upload "$TAG" "$PROVENANCE"

      - name: Generate SBOM
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/dependency-graph/sbom" \
            | jq '.sbom' > "vanillapdf.py-${TAG}-sbom.spdx.json"

      - name: Upload SBOM to release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: |
          gh release upload "$TAG" "vanillapdf.py-${TAG}-sbom.spdx.json"

      - name: Attest SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6  # v4.2.2
        with:
          subject-path: vanillapdf.py-${{ inputs.tag }}-sbom.spdx.json
          sbom-path: vanillapdf.py-${{ inputs.tag }}-sbom.spdx.json
